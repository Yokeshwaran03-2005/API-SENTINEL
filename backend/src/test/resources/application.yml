spring:
  application:
    name: api-sentinel-backend-test
  datasource:
    url: jdbc:h2:mem:apisentinel_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.apisentinel: INFO
