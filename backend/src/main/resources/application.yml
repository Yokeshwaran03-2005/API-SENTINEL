server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-sentinel-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://dpg-dae0l30u01pc73cju9hg-a:5432/apibackend_xu16}}
    username: ${DB_USERNAME:apibackend_xu16_user}
    password: ${DB_PASSWORD:t1VbJtpHtjNspejgnUiF0dRUg9Tuf9pD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SentinelHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.apisentinel: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# API Sentinel Application Specific Settings
sentinel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# Threat Scoring Engine Configuration (Phase 6)
apisentinel:
  scoring:
    max-score: 100
    weights:
      AUTHENTICATION_ABUSE: 20
      INJECTION: 30
      RATE_ABUSE: 20
      ENUMERATION: 15
      SENSITIVE_DATA_EXPOSURE: 15
    low-max: 29
    medium-min: 30
    medium-max: 59
    high-min: 60
    high-max: 79
    critical-min: 80
  # Security Policy Engine Configuration (Phase 7)
  policy:
    block-threshold: 80
    high-threshold: 60
    medium-threshold: 30
    block-duration-minutes: 15
    rate-limit-window-seconds: 60
    rate-limit-max-requests: 100
    persist-security-events: true
    enable-dynamic-blocking: true


